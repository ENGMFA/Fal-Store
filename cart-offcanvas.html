<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- SwiperJS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
  <!-- Fontawsome -->
  <link rel="stylesheet" href="css/all.min.css" />
  <!-- Bootstrap CSS -->
  <link rel="stylesheet" href="css/bootstrap.rtl.min.css" />
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@100;200;300;400;500;600;700&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <title>Document</title>
</head>

<body>
  <!-- Start Mini Cart -->
  <div class="offcanvas offcanvas-end" tabindex="-1" id="cart">
    <div class="offcanvas-header">
      <h4 class="offcanvas-title" id="cartlabel">سلة المشتريات</h4>
      <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Close"></button>
    </div>

    <div class="offcanvas-body">
      <div class="row row-mini-card">
        <div class="col mini-card">
          <img src="img/Basic-2.png" alt="Bascic-Air Curtain" class="w-100 img-fluid card-img-top" loading="lazy">
          <p class="mt-4">فال ستارة هوائية Basic</p>
          <div class="btn-group btns-quantity-mini">
            <button type="button" class="btn btn-outline-primary">+</button>
            <button type="button" class="btn btn-outline-primary text-muted">1</button>
            <button type="button" class="btn btn-outline-primary">-</button>
          </div>
        </div>


        <div class="col mini-card">
          <img src="img/Ceiling-1.webp" alt="Bascic-Air Curtain" class="w-100 img-fluid card-img-top" loading="lazy">
          <p class="mt-4">فال ستارة هوائية Ceiling</p>
          <div class="btn-group btns-quantity-mini">
            <button type="button" class="btn btn-outline-primary">+</button>
            <button type="button" class="btn btn-outline-primary text-muted">1</button>
            <button type="button" class="btn btn-outline-primary">-</button>
          </div>
        </div>


        <div class="col mini-card">
          <img src="img/Compact.png" alt="Bascic-Air Curtain" class="w-100 img-fluid card-img-top" loading="lazy">
          <p class="mt-4">فال ستارة هوائية Compact</p>
          <div class="btn-group btns-quantity-mini">
            <button type="button" class="btn btn-outline-primary">+</button>
            <button type="button" class="btn btn-outline-primary text-muted">1</button>
            <button type="button" class="btn btn-outline-primary">-</button>
          </div>
        </div>


        <div class="col mini-card">
          <img src="img/Drive thru Series.jpg" alt="Bascic-Air Curtain" class="w-100 img-fluid card-img-top"
            loading="lazy">
          <p class="mt-4">فال ستارة هوائية Drive-Thru</p>
          <div class="btn-group btns-quantity-mini">
            <button type="button" class="btn btn-outline-primary">+</button>
            <button type="button" class="btn btn-outline-primary text-muted">1</button>
            <button type="button" class="btn btn-outline-primary">-</button>
          </div>
        </div>


        <div class="col mini-card">
          <img src="img/Industrial-1.webp" alt="Bascic-Air Curtain" class="w-100 img-fluid card-img-top" loading="lazy">
          <p class="mt-4">فال ستارة هواء صناعية</p>
          <div class="btn-group btns-quantity-mini">
            <button type="button" class="btn btn-outline-primary">+</button>
            <button type="button" class="btn btn-outline-primary text-muted">1</button>
            <button type="button" class="btn btn-outline-primary">-</button>
          </div>
        </div>


        <div class="col mini-card">
          <img src="img/SS.png" alt="Bascic-Air Curtain" class="w-100 img-fluid card-img-top" loading="lazy">
          <p class="mt-4">فال ستارة هوائية SS</p>
          <div class="btn-group btns-quantity-mini">
            <button type="button" class="btn btn-outline-primary">+</button>
            <button type="button" class="btn btn-outline-primary text-muted">1</button>
            <button type="button" class="btn btn-outline-primary">-</button>
          </div>
        </div>
      </div>
      <div class="d-flex flex-column gap-3">
        <p class="alert alert-info p-3 my-3 text-center fw-bold">مجموع المنتجات : 3000 ر.س</p>
        <a href="cart.html"><button class="btn btn-outline-primary w-100">عرض السلة</button></a>
        <a href="checkout.html"><button class="btn btn-outline-success w-100">إتمام الشراء</button></a>
      </div>
    </div>
  </div>
  <!-- End Mini Cart -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
  <script src="https://unpkg.com/isotope-layout@3/dist/isotope.pkgd.min.js"></script>
  <script src="js/bootstrap.bundle.min.js"></script>
  <!-- <script type="module" src="js/threejs.js"></script> -->
  <script src="js/components.js"></script>
  <script src="js/script.js"></script>
</body>

</html>
